[mod]
id = "ambience"
version = "0.1.1"

[compatibility]
horizon_revision = "6d99e14ff0c70ae60bc56b67829b526409fa068e"

[[module]]
id = "core"
file = "crates/horizon-client/src/game.rs"
name = "official_ambience"
source = "core.rs"

[[module]]
id = "pack"
file = "crates/horizon-client/src/game.rs"
name = "official_ambience_pack"
source = "pack.rs"

[[module]]
id = "choose"
file = "crates/horizon-client/src/game.rs"
name = "official_ambience_choose"
source = "choose.rs"

[[module]]
id = "player"
file = "crates/horizon-client/src/game.rs"
name = "official_ambience_player"
source = "player.rs"

[[module]]
id = "rules"
file = "crates/horizon-client/src/game.rs"
name = "official_ambience_rules"
source = "rules.rs"

[[module]]
id = "debug"
file = "crates/horizon-client/src/game.rs"
name = "official_ambience_debug"
source = "debug.rs"

[[module]]
id = "page"
file = "crates/horizon-client/src/game.rs"
name = "official_ambience_page"
source = "page.rs"

[[injection]]
id = "list"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::mod_api::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
hook = "settings"
hook_version = 1
kind = "HEAD"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
hook = "settings_click"
hook_version = 1
kind = "HEAD"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

[[injection]]
id = "music"
hook = "music"
hook_version = 1
kind = "HEAD"
helper = "music.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "music", ty = "&mut Option<horizon_client::music::Music>", value = "&mut *music" },
]

[[injection]]
id = "frame"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "elapsed", ty = "std::time::Duration", value = "elapsed" },
]

[[injection]]
id = "command"
hook = "command"
hook_version = 1
kind = "HEAD"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "commands"
hook = "commands"
hook_version = 1
kind = "HEAD"
helper = "commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<&'static str>", value = "&mut *commands" },
]
